name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build theme from source
        run: npm run build
      - name: Validate generated JSON
        run: node -e "JSON.parse(require('fs').readFileSync('theme/one-nord.json','utf8'))"
